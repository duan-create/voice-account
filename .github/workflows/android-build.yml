name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build offline Whisper APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run existing unit tests
        run: npm test

      - name: Verify model preparation failure guards and cloud hooks
        run: node --test tests/whisper-assets.test.cjs tests/cloud-android.test.cjs

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Verify native recording and recurrence logic
        run: |
          mkdir -p .cache/java-tests
          javac -d .cache/java-tests \
            android/app/src/main/java/com/duancreate/voiceaccount/PcmCapture.java \
            android/app/src/main/java/com/duancreate/voiceaccount/PlanClock.java \
            tests/android/PcmCaptureTest.java tests/android/PlanClockTest.java
          java -cp .cache/java-tests com.duancreate.voiceaccount.PcmCaptureTest
          java -cp .cache/java-tests com.duancreate.voiceaccount.PlanClockTest

      - name: Install SDK, NDK and CMake
        run: |
          # AGP 8.13 also defaults to Build-Tools 35.0.0 in dependency modules.
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Download and verify pinned Whisper source and tiny Q5_1 model
        shell: pwsh
        run: ./scripts/prepare-android-whisper.ps1

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build Debug APK with native Whisper
        working-directory: android
        run: |
          chmod +x gradlew
          # Override the Windows-only project property without editing it.
          ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" \
            --no-daemon --stacktrace --max-workers=2 assembleDebug

      - name: Verify APK includes the model and both native libraries
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk"
          unzip -p "$apk" assets/models/ggml-tiny-q5_1.bin | \
            sha256sum --check <(echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  -")
          if unzip -Z1 "$apk" | grep -qx 'assets/models/ggml-base-q5_1.bin'; then
            echo 'Obsolete base model must not be packaged.' >&2
            exit 1
          fi
          for abi in arm64-v8a x86_64; do
            unzip -p "$apk" "lib/$abi/libvoice_whisper.so" > /dev/null
          done
          sha256sum "$apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-account-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
