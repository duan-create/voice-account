<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>语音记账</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="manifest" href="./manifest.json">
    <script src="./capacitor.js"></script>
    <script src="./js/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>语音记账</h1>
      <span class="header-mark" aria-hidden="true">VOICE ACCOUNT</span>
    </header>
    <main id="app">
      <div id="home-view" role="tabpanel" aria-labelledby="home-tab">
      <section class="summary-section" aria-label="本月收支汇总">
        <dl class="summary-grid">
          <div class="summary-card">
            <dt>本月收入</dt>
            <dd><span class="currency">¥</span><span class="summary-amount" id="month-income">--</span></dd>
          </div>
          <div class="summary-card">
            <dt>本月支出</dt>
            <dd><span class="currency">¥</span><span class="summary-amount" id="month-expense">--</span></dd>
          </div>
        </dl>
        <section class="budget-section" aria-labelledby="budget-title">
          <div class="section-heading">
            <h2 id="budget-title">本月预算</h2>
            <button id="open-budget" class="text-button" type="button" disabled>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16 4l4 4L8 20l-5 1 1-5Z" /></svg>
              <span>设置预算</span>
            </button>
          </div>
          <div id="budget-overview">正在加载预算...</div>
          <div id="category-budgets"></div>
        </section>
        <p class="storage-notice">数据仅保存在本地浏览器，清除缓存会丢失，建议定期导出备份</p>
      </section>

      <section class="entry-section" aria-label="记账操作">
        <button class="voice-button" type="button" disabled aria-describedby="voice-status" aria-pressed="false">
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <span>按住说话 记账</span>
          <i class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></i>
        </button>
        <p id="voice-status" class="voice-status" role="status" aria-live="polite"></p>
        <p id="offline-status" class="offline-status" role="status" hidden>当前离线，语音识别暂不可用，请使用手动记账。</p>
        <button class="manual-button" type="button" disabled>
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" />
          </svg>
          <span>手动记账</span>
        </button>
      </section>

      <section class="bills-section" aria-labelledby="bills-title">
        <div class="section-heading">
          <h2 id="bills-title">账单列表</h2>
        </div>
        <p id="list-state" class="list-state" role="status">正在加载账单...</p>
        <div class="bill-list"></div>
        <template id="bill-template">
          <li class="bill-item">
            <span class="bill-icon" aria-hidden="true"></span>
            <div class="bill-info">
              <h3 class="bill-category"></h3>
              <time></time>
              <p class="bill-remark"></p>
            </div>
            <div class="bill-value">
              <span class="bill-amount"></span>
              <span class="bill-type"></span>
              <span class="bill-warning" hidden>分类超支</span>
            </div>
            <div class="bill-actions">
              <button class="bill-action" type="button" data-action="edit">编辑</button>
              <button class="bill-action bill-delete" type="button" data-action="delete">删除</button>
            </div>
          </li>
        </template>
      </section>
      <footer class="backup-section">
        <button id="export-backup" class="backup-button" type="button" disabled>
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="m7 10 5 5 5-5M12 15V3" />
          </svg>
          <span>导出备份</span>
        </button>
      </footer>
      </div>
      <div id="statistics-view" role="tabpanel" aria-labelledby="statistics-tab" hidden>
        <div class="section-heading statistics-heading"><h2>收支统计</h2><span id="statistics-month"></span></div>
        <section class="chart-section" aria-labelledby="category-chart-title">
          <div class="section-heading"><h3 id="category-chart-title">本月分类支出</h3><strong id="category-total">¥0.00</strong></div>
          <div class="category-chart-layout">
            <canvas id="category-chart" role="img" aria-label="本月分类支出饼图"></canvas>
            <div id="category-legend" aria-label="分类支出明细筛选"></div>
          </div>
        </section>
        <section id="category-details" aria-labelledby="details-title" hidden>
          <h3 id="details-title"></h3>
          <ul id="detail-list"></ul>
          <p id="detail-empty" class="list-state">本月该分类暂无支出</p>
        </section>
        <section class="chart-section" aria-labelledby="trend-title">
          <div class="section-heading"><h3 id="trend-title">近6个月收支</h3></div>
          <div class="trend-legend"><span><i class="income-dot"></i>收入</span><span><i class="expense-dot"></i>支出</span></div>
          <canvas id="trend-chart" role="img" aria-label="近6个月收入支出趋势，数据见下方表格"></canvas>
          <details class="trend-table"><summary>月度收支明细</summary><table><thead><tr><th>月份</th><th>收入（元）</th><th>支出（元）</th></tr></thead><tbody id="trend-data"></tbody></table></details>
        </section>
      </div>
    </main>
    <nav class="bottom-nav" aria-label="主导航">
      <div role="tablist" aria-label="记账视图">
        <button id="home-tab" type="button" role="tab" aria-selected="true" aria-controls="home-view">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg><span>首页</span>
        </button>
        <button id="statistics-tab" type="button" role="tab" aria-selected="false" aria-controls="statistics-view" tabindex="-1">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 16v-5M13 16V7M18 16v-8" /></svg><span>统计</span>
        </button>
      </div>
    </nav>
    <p id="app-message" class="app-message" role="status" aria-live="polite"></p>
    <dialog id="bill-dialog" aria-labelledby="form-title">
      <form id="bill-form" novalidate>
        <h2 id="form-title">手动记账</h2>
        <fieldset id="form-fields">
          <legend class="sr-only">账单信息</legend>
          <fieldset class="type-options">
            <legend>收支类型</legend>
            <label><input type="radio" name="type" value="支出" checked required>支出</label>
            <label><input type="radio" name="type" value="收入" required>收入</label>
          </fieldset>
          <div class="form-field">
            <label for="bill-amount">金额（元）</label>
            <input id="bill-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required aria-describedby="form-message">
          </div>
          <div class="form-field">
            <label for="bill-category">分类</label>
            <select id="bill-category" name="category" required>
              <option>餐饮</option>
              <option>交通</option>
              <option>购物</option>
              <option>住宿</option>
              <option>娱乐</option>
              <option>其他</option>
            </select>
          </div>
          <div class="form-field">
            <label for="bill-remark">备注</label>
            <textarea id="bill-remark" name="remark" rows="2"></textarea>
          </div>
          <div class="form-field">
            <label for="bill-date">日期</label>
            <input id="bill-date" name="date" type="date" required>
          </div>
          <p id="form-message" class="form-message" role="alert"></p>
          <div class="form-actions">
            <button class="cancel-button" id="cancel-bill" type="button">取消</button>
            <button class="save-button" type="submit">确认</button>
          </div>
        </fieldset>
      </form>
    </dialog>
    <dialog id="budget-dialog" aria-labelledby="budget-form-title">
      <form id="budget-form" novalidate>
        <h2 id="budget-form-title">月度预算</h2>
        <fieldset>
          <legend class="sr-only">预算额度</legend>
          <div class="form-field">
            <label for="budget-total">月度总预算（元）</label>
            <input id="budget-total" name="total" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="未设置">
          </div>
          <div id="budget-category-fields"></div>
          <p id="budget-message" class="form-message" role="alert"></p>
          <div class="form-actions">
            <button class="cancel-button" id="cancel-budget" type="button">取消</button>
            <button class="save-button" type="submit">保存预算</button>
          </div>
        </fieldset>
      </form>
    </dialog>
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
