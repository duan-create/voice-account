<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>语音记账</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="manifest" href="./manifest.json">
    <script src="./js/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>语音记账</h1>
    </header>
    <main id="app">
      <section class="summary-section" aria-label="本月收支汇总">
        <dl class="summary-grid">
          <div class="summary-card">
            <dt>本月收入</dt>
            <dd><span class="currency">¥</span><span class="summary-amount">0.00</span></dd>
          </div>
          <div class="summary-card">
            <dt>本月支出</dt>
            <dd><span class="currency">¥</span><span class="summary-amount">0.00</span></dd>
          </div>
        </dl>
      </section>

      <section class="entry-section" aria-label="记账操作">
        <button class="voice-button" type="button">
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <span>按住说话 记账</span>
        </button>
        <button class="manual-button" type="button">
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" />
          </svg>
          <span>手动记账</span>
        </button>
      </section>

      <section class="bills-section" aria-labelledby="bills-title">
        <div class="section-heading">
          <h2 id="bills-title">账单列表</h2>
          <span class="sample-label">示例数据</span>
        </div>
        <ul class="bill-list">
          <li class="bill-item">
            <div class="bill-info">
              <h3 class="bill-category">餐饮</h3>
              <time datetime="2026-11-12">2026-11-12</time>
            </div>
            <div class="bill-value">
              <span class="bill-amount">-¥28.00</span>
              <span class="bill-type">支出</span>
            </div>
          </li>
          <li class="bill-item">
            <div class="bill-info">
              <h3 class="bill-category">交通</h3>
              <time datetime="2026-11-11">2026-11-11</time>
            </div>
            <div class="bill-value">
              <span class="bill-amount">-¥6.00</span>
              <span class="bill-type">支出</span>
            </div>
          </li>
          <li class="bill-item bill-item-income">
            <div class="bill-info">
              <h3 class="bill-category">工资</h3>
              <time datetime="2026-11-10">2026-11-10</time>
            </div>
            <div class="bill-value">
              <span class="bill-amount">+¥5,000.00</span>
              <span class="bill-type">收入</span>
            </div>
          </li>
        </ul>
      </section>
    </main>
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
