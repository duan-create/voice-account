<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>语音记账</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="manifest" href="./manifest.json">
    <script src="./js/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>语音记账</h1>
    </header>
    <main id="app">
      <section class="summary-section" aria-label="本月收支汇总">
        <dl class="summary-grid">
          <div class="summary-card">
            <dt>本月收入</dt>
            <dd><span class="currency">¥</span><span class="summary-amount" id="month-income">--</span></dd>
          </div>
          <div class="summary-card">
            <dt>本月支出</dt>
            <dd><span class="currency">¥</span><span class="summary-amount" id="month-expense">--</span></dd>
          </div>
        </dl>
      </section>

      <section class="entry-section" aria-label="记账操作">
        <button class="voice-button" type="button" disabled aria-describedby="voice-status" aria-pressed="false">
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <span>按住说话 记账</span>
        </button>
        <p id="voice-status" class="voice-status" role="status" aria-live="polite"></p>
        <button class="manual-button" type="button" disabled>
          <!-- @license lucide-static v0.468.0 - ISC -->
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" />
          </svg>
          <span>手动记账</span>
        </button>
      </section>

      <section class="bills-section" aria-labelledby="bills-title">
        <div class="section-heading">
          <h2 id="bills-title">账单列表</h2>
        </div>
        <p id="app-message" class="app-message" role="status" aria-live="polite"></p>
        <p id="list-state" class="list-state" role="status">正在加载账单...</p>
        <ul class="bill-list"></ul>
        <template id="bill-template">
          <li class="bill-item">
            <div class="bill-info">
              <h3 class="bill-category"></h3>
              <time></time>
              <p class="bill-remark"></p>
            </div>
            <div class="bill-value">
              <span class="bill-amount"></span>
              <span class="bill-type"></span>
            </div>
            <div class="bill-actions">
              <button class="bill-action" type="button" data-action="edit">编辑</button>
              <button class="bill-action bill-delete" type="button" data-action="delete">删除</button>
            </div>
          </li>
        </template>
      </section>
    </main>
    <dialog id="bill-dialog" aria-labelledby="form-title">
      <form id="bill-form" novalidate>
        <h2 id="form-title">手动记账</h2>
        <fieldset id="form-fields">
          <legend class="sr-only">账单信息</legend>
          <fieldset class="type-options">
            <legend>收支类型</legend>
            <label><input type="radio" name="type" value="支出" checked required>支出</label>
            <label><input type="radio" name="type" value="收入" required>收入</label>
          </fieldset>
          <div class="form-field">
            <label for="bill-amount">金额（元）</label>
            <input id="bill-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required aria-describedby="form-message">
          </div>
          <div class="form-field">
            <label for="bill-category">分类</label>
            <select id="bill-category" name="category" required>
              <option>餐饮</option>
              <option>交通</option>
              <option>购物</option>
              <option>住宿</option>
              <option>娱乐</option>
              <option>其他</option>
            </select>
          </div>
          <div class="form-field">
            <label for="bill-remark">备注</label>
            <textarea id="bill-remark" name="remark" rows="2"></textarea>
          </div>
          <div class="form-field">
            <label for="bill-date">日期</label>
            <input id="bill-date" name="date" type="date" required>
          </div>
          <p id="form-message" class="form-message" role="alert"></p>
          <div class="form-actions">
            <button class="cancel-button" id="cancel-bill" type="button">取消</button>
            <button class="save-button" type="submit">确认</button>
          </div>
        </fieldset>
      </form>
    </dialog>
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
